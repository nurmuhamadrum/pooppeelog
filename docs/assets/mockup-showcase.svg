<svg viewBox="0 0 1100 640" width="100%" height="auto" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvasGrad" x1="0" y1="0" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#181512" />
      <stop offset="50%" stopColor="#221D19" />
      <stop offset="100%" stopColor="#181512" />
    </linearGradient>

    <!-- Phone Shadow -->
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Device Frame Gradients -->
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3D352E" />
      <stop offset="100%" stopColor="#221C18" />
    </linearGradient>

    <!-- Mascot Gradients -->
    <linearGradient id="plopM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#C98A58" />
      <stop offset="100%" stopColor="#7A4824" />
    </linearGradient>
    <linearGradient id="dripM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#67D5FD" />
      <stop offset="100%" stopColor="#0E78C2" />
    </linearGradient>
    <linearGradient id="flushM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#2FB8AC" />
    </linearGradient>

    <!-- Radar Pulse -->
    <radialGradient id="radarPulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stopColor="#2FB8AC" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#2FB8AC" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#2FB8AC" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1100" height="640" rx="32" fill="url(#bgCanvasGrad)" stroke="#3D352E" stroke-width="2" />

  <!-- Grid lines in background for tech/map feel -->
  <g opacity="0.12" stroke="#FAF5EE" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640" stroke-dasharray="4 6" />
    <line x1="280" y1="0" x2="280" y2="640" stroke-dasharray="4 6" />
    <line x1="550" y1="0" x2="550" y2="640" stroke-dasharray="4 6" />
    <line x1="820" y1="0" x2="820" y2="640" stroke-dasharray="4 6" />
    <line x1="1020" y1="0" x2="1020" y2="640" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="1100" y2="120" stroke-dasharray="4 6" />
    <line x1="0" y1="360" x2="1100" y2="360" stroke-dasharray="4 6" />
  </g>

  <!-- Header Title in Mockup Showcase -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#F5B700" fill-opacity="0.15" stroke="#F5B700" stroke-opacity="0.4" />
    <text x="85" y="17" fill="#F5B700" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">APP INTERFACE MOCKUP</text>
    <text x="0" y="54" fill="#FAF5EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">Pengalaman Visual Sat-Set &amp; Privat</text>
    <text x="560" y="54" fill="#E6D7C3" fill-opacity="0.7" font-family="sans-serif" font-size="13" font-weight="500">
      Dibangun menggunakan React Native Expo &amp; Tailwind CSS dengan tema Warm Dark (#1E1A17).
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 1 (LEFT): PERSONAL MAP (Peta Jejak Kelegaan) -->
  <!-- ========================================================================= -->
  <g transform="translate(70, 95)" filter="url(#phoneShadow)">
    <!-- Device Frame -->
    <rect width="280" height="490" rx="38" fill="#1E1A17" stroke="url(#bezelGrad)" stroke-width="8" />

    <!-- Screen Area (Clip Path) -->
    <g>
      <rect x="6" y="6" width="268" height="478" rx="32" fill="#1E1A17" />

      <!-- Map Grid Texture -->
      <g opacity="0.25" stroke="#3D352E" stroke-width="1.2">
        <line x1="20" y1="20" x2="260" y2="20" />
        <line x1="20" y1="80" x2="260" y2="80" />
        <line x1="20" y1="140" x2="260" y2="140" />
        <line x1="20" y1="200" x2="260" y2="200" />
        <line x1="20" y1="260" x2="260" y2="260" />
        <line x1="20" y1="320" x2="260" y2="320" />
        <line x1="20" y1="380" x2="260" y2="380" />
        <line x1="70" y1="20" x2="70" y2="440" />
        <line x1="140" y1="20" x2="140" y2="440" />
        <line x1="210" y1="20" x2="210" y2="440" />
      </g>

      <!-- Road Curves on Map -->
      <path d="M10 240 Q90 220 140 260 T270 210" fill="none" stroke="#2E2823" stroke-width="16" />
      <path d="M10 240 Q90 220 140 260 T270 210" fill="none" stroke="#3D352E" stroke-width="10" />
      <path d="M140 30 Q130 160 140 260 T160 450" fill="none" stroke="#2E2823" stroke-width="18" />
      <path d="M140 30 Q130 160 140 260 T160 450" fill="none" stroke="#3D352E" stroke-width="12" />

      <!-- Radar Pulse Circle at user location -->
      <circle cx="140" cy="240" r="54" fill="url(#radarPulse)" />
      <circle cx="140" cy="240" r="54" fill="none" stroke="#2FB8AC" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
      <circle cx="140" cy="240" r="8" fill="#2FB8AC" />
      <circle cx="140" cy="240" r="14" fill="#2FB8AC" fill-opacity="0.3" />

      <!-- Mascot Pin: Lil' Drip (Pee Pin at Monas/Menteng) -->
      <g transform="translate(65, 130)">
        <path d="M22 40 L16 30 L28 30 Z" fill="#F5B700" />
        <rect x="0" y="0" width="44" height="32" rx="10" fill="#F5B700" stroke="#FAF5EE" stroke-width="2" />
        <text x="22" y="20" fill="#1E1A17" font-family="sans-serif" font-size="16" text-anchor="middle">💧</text>
      </g>

      <!-- Mascot Pin: Mr. Plop (Poop Pin at SCBD/Senayan) -->
      <g transform="translate(170, 290)">
        <path d="M22 40 L16 30 L28 30 Z" fill="#8B5E3C" />
        <rect x="0" y="0" width="44" height="32" rx="10" fill="#8B5E3C" stroke="#FAF5EE" stroke-width="2" />
        <text x="22" y="20" fill="#FAF5EE" font-family="sans-serif" font-size="16" text-anchor="middle">🍫</text>
      </g>

      <!-- Top Notch & Island -->
      <rect x="95" y="14" width="90" height="20" rx="10" fill="#000000" />
      <circle cx="170" cy="24" r="3.5" fill="#1E1A17" />

      <!-- Map Floating Header Pills -->
      <g transform="translate(18, 48)">
        <rect x="0" y="0" width="244" height="38" rx="14" fill="#2E2823" fill-opacity="0.95" stroke="#3D352E" stroke-width="1.2" />
        <text x="14" y="23" fill="#FAF5EE" font-family="sans-serif" font-size="12" font-weight="900">🗺️ Peta Pribadi</text>
        <!-- Filter chips -->
        <rect x="135" y="8" width="46" height="22" rx="7" fill="#F5B700" />
        <text x="158" y="23" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">PEE</text>
        <rect x="186" y="8" width="46" height="22" rx="7" fill="#8B5E3C" />
        <text x="209" y="23" fill="#FAF5EE" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">POOP</text>
      </g>

      <!-- Bottom Floating FAB & Bar -->
      <g transform="translate(18, 412)">
        <rect x="0" y="0" width="244" height="52" rx="20" fill="#2E2823" stroke="#3D352E" stroke-width="1.2" />
        <!-- Map Icon Active -->
        <circle cx="40" cy="26" r="14" fill="#2FB8AC" fill-opacity="0.2" />
        <text x="40" y="31" fill="#2FB8AC" font-family="sans-serif" font-size="13" text-anchor="middle">🗺️</text>
        <!-- Diary Icon -->
        <text x="88" y="31" fill="#E6D7C3" font-family="sans-serif" font-size="13" text-anchor="middle" opacity="0.6">📖</text>
        <!-- Stats Icon -->
        <text x="160" y="31" fill="#E6D7C3" font-family="sans-serif" font-size="13" text-anchor="middle" opacity="0.6">📊</text>
        <!-- Settings Icon -->
        <text x="208" y="31" fill="#E6D7C3" font-family="sans-serif" font-size="13" text-anchor="middle" opacity="0.6">⚙️</text>
      </g>
      <!-- Center FAB Button -->
      <circle cx="140" cy="432" r="24" fill="#F5B700" stroke="#1E1A17" stroke-width="4" />
      <text x="140" y="438" fill="#1E1A17" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">+</text>
    </g>

    <!-- Caption Below Device -->
    <text x="140" y="525" fill="#FAF5EE" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">1. Peta Pribadi Realtime</text>
    <text x="140" y="542" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="0.7">GPS Radar &amp; Pin Maskot Lucu</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 2 (CENTER ELEVATED): 3-SECOND QUICK LOG MODAL -->
  <!-- ========================================================================= -->
  <g transform="translate(410, 75)" filter="url(#phoneShadow)">
    <!-- Device Frame with Golden Glow Border -->
    <rect width="280" height="490" rx="38" fill="#1E1A17" stroke="#F5B700" stroke-width="3" />
    <rect x="-4" y="-4" width="288" height="498" rx="42" fill="none" stroke="url(#bezelGrad)" stroke-width="8" />

    <!-- Screen Area -->
    <g>
      <rect x="6" y="6" width="268" height="478" rx="32" fill="#1E1A17" />

      <!-- Dimmed Background -->
      <rect x="6" y="6" width="268" height="478" rx="32" fill="#000000" fill-opacity="0.45" />

      <!-- Top Island -->
      <rect x="95" y="14" width="90" height="20" rx="10" fill="#000000" />

      <!-- Modal Bottom Sheet Active -->
      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="252" height="415" rx="26" fill="#2E2823" stroke="#3D352E" stroke-width="1.5" />

        <!-- Handle bar -->
        <rect x="106" y="10" width="40" height="4" rx="2" fill="#FAF5EE" opacity="0.3" />

        <!-- Title -->
        <text x="126" y="38" fill="#FAF5EE" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">Catat Kelegaan ⚡</text>
        <text x="126" y="54" fill="#E6D7C3" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" opacity="0.75">Waktu &amp; GPS terekam otomatis</text>

        <!-- Button 1: Lil' Drip (PEE) -->
        <g transform="translate(14, 68)">
          <rect width="224" height="82" rx="16" fill="#F5B700" fill-opacity="0.14" stroke="#F5B700" stroke-width="2" />
          <circle cx="44" cy="41" r="26" fill="#F5B700" />
          <text x="44" y="48" fill="#1E1A17" font-family="sans-serif" font-size="24" text-anchor="middle">💧</text>
          <text x="82" y="34" fill="#F5B700" font-family="sans-serif" font-size="14" font-weight="900">PEE (Kencing)</text>
          <text x="82" y="52" fill="#E6D7C3" font-family="sans-serif" font-size="10.5" font-weight="500" opacity="0.8">Tetesan segar Lil' Drip</text>
          <rect x="180" y="28" width="34" height="24" rx="7" fill="#F5B700" />
          <text x="197" y="44" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">PILIH</text>
        </g>

        <!-- Button 2: Mr. Plop (POOP) -->
        <g transform="translate(14, 160)">
          <rect width="224" height="82" rx="16" fill="#8B5E3C" fill-opacity="0.18" stroke="#8B5E3C" stroke-width="2" />
          <circle cx="44" cy="41" r="26" fill="#8B5E3C" />
          <text x="44" y="48" fill="#FAF5EE" font-family="sans-serif" font-size="24" text-anchor="middle">🍫</text>
          <text x="82" y="34" fill="#C98A58" font-family="sans-serif" font-size="14" font-weight="900">POOP (BAB)</text>
          <text x="82" y="52" fill="#E6D7C3" font-family="sans-serif" font-size="10.5" font-weight="500" opacity="0.8">Plong lega bersama Mr. Plop</text>
          <rect x="180" y="28" width="34" height="24" rx="7" fill="#8B5E3C" />
          <text x="197" y="44" fill="#FAF5EE" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">PILIH</text>
        </g>

        <!-- Button 3: Sir Flush (COMBO) -->
        <g transform="translate(14, 252)">
          <rect width="224" height="66" rx="16" fill="#2FB8AC" fill-opacity="0.15" stroke="#2FB8AC" stroke-width="1.8" />
          <circle cx="36" cy="33" r="20" fill="#2FB8AC" />
          <text x="36" y="39" fill="#1E1A17" font-family="sans-serif" font-size="18" text-anchor="middle">🚽</text>
          <text x="68" y="28" fill="#2FB8AC" font-family="sans-serif" font-size="12" font-weight="900">Sir Flush (Keduanya)</text>
          <text x="68" y="44" fill="#E6D7C3" font-family="sans-serif" font-size="10" opacity="0.75">Paket kombo sekali bilas</text>
        </g>

        <!-- Mood selector preview -->
        <g transform="translate(14, 328)">
          <text x="0" y="12" fill="#FAF5EE" font-family="sans-serif" font-size="11" font-weight="800">Mood Kelegaan:</text>
          <rect x="0" y="20" width="70" height="24" rx="8" fill="#2FB8AC" />
          <text x="35" y="36" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">😌 Lega</text>

          <rect x="76" y="20" width="76" height="24" rx="8" fill="#1E1A17" stroke="#3D352E" />
          <text x="114" y="36" fill="#E6D7C3" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">⏱️ Nahan</text>

          <rect x="158" y="20" width="66" height="24" rx="8" fill="#1E1A17" stroke="#3D352E" />
          <text x="191" y="36" fill="#E6D7C3" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🚨 Gawat</text>
        </g>
      </g>
    </g>

    <!-- Caption Below Device -->
    <text x="140" y="545" fill="#F5B700" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">2. Quick Log 3-Detik</text>
    <text x="140" y="562" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="0.7">Sat-Set 2-Tap Tanpa Ribet</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 3 (RIGHT): STATS, STREAKS & BADGES -->
  <!-- ========================================================================= -->
  <g transform="translate(750, 95)" filter="url(#phoneShadow)">
    <!-- Device Frame -->
    <rect width="280" height="490" rx="38" fill="#1E1A17" stroke="url(#bezelGrad)" stroke-width="8" />

    <!-- Screen Area -->
    <g>
      <rect x="6" y="6" width="268" height="478" rx="32" fill="#1E1A17" />

      <!-- Top Island -->
      <rect x="95" y="14" width="90" height="20" rx="10" fill="#000000" />

      <g transform="translate(18, 48)">
        <!-- Title -->
        <text x="0" y="16" fill="#FAF5EE" font-family="sans-serif" font-size="16" font-weight="900">Statistik &amp; Lencana</text>
        <text x="0" y="32" fill="#E6D7C3" font-family="sans-serif" font-size="10.5" font-weight="500" opacity="0.7">Habit biologis &amp; gamifikasi</text>

        <!-- Streak Card -->
        <g transform="translate(0, 42)">
          <rect width="244" height="74" rx="16" fill="#2E2823" stroke="#F5B700" stroke-width="1.2" stroke-opacity="0.6" />
          <circle cx="36" cy="37" r="22" fill="#F5B700" fill-opacity="0.2" />
          <text x="36" y="44" fill="#F5B700" font-family="sans-serif" font-size="22" text-anchor="middle">🔥</text>
          <text x="68" y="30" fill="#FAF5EE" font-family="sans-serif" font-size="11" font-weight="800">Streak Harian</text>
          <text x="68" y="52" fill="#F5B700" font-family="sans-serif" font-size="20" font-weight="900">7 Hari <tspan fill="#E6D7C3" font-size="11" font-weight="500">Beruntun</tspan></text>
          <rect x="180" y="24" width="52" height="24" rx="8" fill="#2FB8AC" />
          <text x="206" y="40" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">LEGA</text>
        </g>

        <!-- Metric Counter Grid -->
        <g transform="translate(0, 126)">
          <!-- Pee Total -->
          <rect x="0" y="0" width="76" height="58" rx="12" fill="#2E2823" stroke="#3D352E" />
          <text x="38" y="18" fill="#F5B700" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">💧 PEE</text>
          <text x="38" y="42" fill="#FAF5EE" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">38</text>

          <!-- Poop Total -->
          <rect x="84" y="0" width="76" height="58" rx="12" fill="#2E2823" stroke="#3D352E" />
          <text x="122" y="18" fill="#C98A58" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">🍫 POOP</text>
          <text x="122" y="42" fill="#FAF5EE" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">14</text>

          <!-- Combo Total -->
          <rect x="168" y="0" width="76" height="58" rx="12" fill="#2E2823" stroke="#3D352E" />
          <text x="206" y="18" fill="#2FB8AC" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">🚽 KOMBO</text>
          <text x="206" y="42" fill="#FAF5EE" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">6</text>
        </g>

        <!-- Unlocked Badges Section -->
        <g transform="translate(0, 196)">
          <text x="0" y="14" fill="#FAF5EE" font-family="sans-serif" font-size="11.5" font-weight="900">Koleksi Lencana Unik (3/5)</text>

          <!-- Badge 1: First Timer -->
          <g transform="translate(0, 24)">
            <rect width="244" height="46" rx="12" fill="#2E2823" stroke="#2FB8AC" stroke-width="1.2" />
            <circle cx="24" cy="23" r="14" fill="#2FB8AC" fill-opacity="0.2" />
            <text x="24" y="28" fill="#2FB8AC" font-family="sans-serif" font-size="13" text-anchor="middle">🎖️</text>
            <text x="46" y="20" fill="#FAF5EE" font-family="sans-serif" font-size="11" font-weight="800">First Timer</text>
            <text x="46" y="34" fill="#E6D7C3" font-family="sans-serif" font-size="9" opacity="0.7">Log pertama sukses tercatat</text>
            <text x="216" y="27" fill="#2FB8AC" font-family="sans-serif" font-size="12">✓</text>
          </g>

          <!-- Badge 2: City Explorer -->
          <g transform="translate(0, 76)">
            <rect width="244" height="46" rx="12" fill="#2E2823" stroke="#F5B700" stroke-width="1.2" />
            <circle cx="24" cy="23" r="14" fill="#F5B700" fill-opacity="0.2" />
            <text x="24" y="28" fill="#F5B700" font-family="sans-serif" font-size="13" text-anchor="middle">🏙️</text>
            <text x="46" y="20" fill="#FAF5EE" font-family="sans-serif" font-size="11" font-weight="800">City Explorer</text>
            <text x="46" y="34" fill="#E6D7C3" font-family="sans-serif" font-size="9" opacity="0.7">3 kecamatan berbeda</text>
            <text x="216" y="27" fill="#F5B700" font-family="sans-serif" font-size="12">✓</text>
          </g>

          <!-- Badge 3: Smooth Flow -->
          <g transform="translate(0, 128)">
            <rect width="244" height="46" rx="12" fill="#2E2823" stroke="#8B5E3C" stroke-width="1.2" />
            <circle cx="24" cy="23" r="14" fill="#8B5E3C" fill-opacity="0.2" />
            <text x="24" y="28" fill="#8B5E3C" font-family="sans-serif" font-size="13" text-anchor="middle">🌊</text>
            <text x="46" y="20" fill="#FAF5EE" font-family="sans-serif" font-size="11" font-weight="800">Smooth Flow</text>
            <text x="46" y="34" fill="#E6D7C3" font-family="sans-serif" font-size="9" opacity="0.7">Streak 7 hari berturut-turut</text>
            <text x="216" y="27" fill="#2FB8AC" font-family="sans-serif" font-size="12">✓</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Caption Below Device -->
    <text x="140" y="525" fill="#FAF5EE" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">3. Gamifikasi &amp; Lencana</text>
    <text x="140" y="542" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="0.7">Streak Api &amp; Koleksi Eksentrik</text>
  </g>
</svg>

