<svg viewBox="0 0 1100 280" width="100%" height="auto" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1100" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E1A17" />
      <stop offset="50%" stopColor="#2A241F" />
      <stop offset="100%" stopColor="#1E1A17" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stopColor="#F5B700" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#F5B700" stopOpacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stopColor="#2FB8AC" stopOpacity="0.22" />
      <stop offset="100%" stopColor="#2FB8AC" stopOpacity="0" />
    </radialGradient>
    <radialGradient id="glowBrown" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stopColor="#A86A3D" stopOpacity="0.22" />
      <stop offset="100%" stopColor="#A86A3D" stopOpacity="0" />
    </radialGradient>

    <!-- Mascots Gradients -->
    <linearGradient id="plopBodyGrad" x1="50" y1="12" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#C98A58" />
      <stop offset="50%" stopColor="#A86A3D" />
      <stop offset="100%" stopColor="#7A4824" />
    </linearGradient>
    <linearGradient id="dripBodyGrad" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#67D5FD" />
      <stop offset="60%" stopColor="#25A5F4" />
      <stop offset="100%" stopColor="#0E78C2" />
    </linearGradient>
    <linearGradient id="flushCeramicGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2EEF5" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="100%" stopColor="#2FB8AC" />
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Border -->
  <rect x="2" y="2" width="1096" height="276" rx="28" fill="url(#bgGrad)" stroke="#3D352E" stroke-width="2" />

  <!-- Ambient Glows -->
  <circle cx="220" cy="140" r="160" fill="url(#glowAmber)" />
  <circle cx="860" cy="140" r="160" fill="url(#glowTeal)" />
  <circle cx="550" cy="140" r="140" fill="url(#glowBrown)" />

  <!-- Left: Brand Title & Tagline -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#2FB8AC" fill-opacity="0.15" stroke="#2FB8AC" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4" fill="#2FB8AC" />
    <text x="28" y="21" fill="#2FB8AC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1">BIOLOGICAL LIFELOGGER</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#FAF5EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Poop Pee Log</text>

    <!-- Tagline & Description -->
    <text x="0" y="112" fill="#F5B700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Track. Log. Lega.</text>
    <text x="0" y="138" fill="#E6D7C3" fill-opacity="0.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Jurnal buang air pribadi layaknya Strava biologis. 100% Privat, Sat-Set 3-Detik &amp; Offline-First.
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="100" height="26" rx="8" fill="#2E2823" stroke="#3D352E" />
      <text x="50" y="17" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ 3-Sec Log</text>

      <rect x="110" y="0" width="115" height="26" rx="8" fill="#2E2823" stroke="#3D352E" />
      <text x="167" y="17" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🗺️ Personal Map</text>

      <rect x="235" y="0" width="105" height="26" rx="8" fill="#2E2823" stroke="#3D352E" />
      <text x="287" y="17" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔥 Fire Streak</text>

      <rect x="350" y="0" width="125" height="26" rx="8" fill="#2E2823" stroke="#3D352E" />
      <text x="412" y="17" fill="#E6D7C3" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛡️ 100% Zero-Ads</text>
    </g>
  </g>

  <!-- Right: Mascot Trio Showcase -->
  <g transform="translate(710, 45)">
    <!-- 1. Mr. Plop (Left in trio) -->
    <g transform="translate(0, 30)">
      <!-- Circle backdrop -->
      <circle cx="50" cy="55" r="48" fill="#2E2823" stroke="#8B5E3C" stroke-width="2" />
      <!-- Mr Plop SVG -->
      <g transform="translate(10, 15) scale(0.8)">
        <ellipse cx="50" cy="88" rx="36" ry="6" fill="#000000" opacity="0.3" />
        <path d="M16 68C14 78 26 88 50 88C74 88 86 78 84 68C82 58 70 54 50 54C30 54 18 58 16 68Z" fill="url(#plopBodyGrad)" stroke="#4A260F" stroke-width="3.5" />
        <path d="M24 45C22 53 32 60 50 60C68 60 78 53 76 45C74 37 66 32 50 32C34 32 26 37 24 45Z" fill="url(#plopBodyGrad)" stroke="#4A260F" stroke-width="3.5" />
        <path d="M50 10C46 16 38 21 36 26C34 31 39 34 50 34C61 34 66 31 64 26C62 21 54 16 50 10Z" fill="url(#plopBodyGrad)" stroke="#4A260F" stroke-width="3.5" />
        <!-- Eyes -->
        <circle cx="38" cy="50" r="7.5" fill="#FFFFFF" stroke="#4A260F" stroke-width="2.5" />
        <circle cx="39" cy="50" r="5" fill="#2B1408" />
        <circle cx="41" cy="48" r="2.2" fill="#FFFFFF" />
        <circle cx="62" cy="50" r="7.5" fill="#FFFFFF" stroke="#4A260F" stroke-width="2.5" />
        <circle cx="61" cy="50" r="5" fill="#2B1408" />
        <circle cx="63" cy="48" r="2.2" fill="#FFFFFF" />
        <!-- Cheeks -->
        <ellipse cx="27" cy="57" rx="5.5" ry="3.5" fill="#FF6B6B" opacity="0.8" />
        <ellipse cx="73" cy="57" rx="5.5" ry="3.5" fill="#FF6B6B" opacity="0.8" />
        <!-- Mouth -->
        <path d="M44 57C44 64 56 64 56 57" fill="#E74C3C" stroke="#4A260F" stroke-width="2.5" />
      </g>
      <!-- Label -->
      <rect x="8" y="110" width="84" height="22" rx="11" fill="#8B5E3C" />
      <text x="50" y="125" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">MR. PLOP</text>
    </g>

    <!-- 2. Sir Flush (Center elevated in trio) -->
    <g transform="translate(120, 0)">
      <!-- Circle backdrop -->
      <circle cx="55" cy="65" r="58" fill="#2E2823" stroke="#2FB8AC" stroke-width="2.5" />
      <!-- Sir Flush SVG -->
      <g transform="translate(10, 15) scale(0.9)">
        <ellipse cx="50" cy="88" rx="26" ry="4" fill="#000000" opacity="0.25" />
        <path d="M34 86L38 48H62L66 86C66 87.5 64.5 88 62 88H38C35.5 88 34 87.5 34 86Z" fill="url(#flushCeramicGrad)" stroke="#134E4A" stroke-width="3" />
        <rect x="24" y="14" width="52" height="34" rx="7" fill="url(#flushCeramicGrad)" stroke="#134E4A" stroke-width="3" />
        <ellipse cx="50" cy="50" rx="30" ry="14" fill="url(#flushCeramicGrad)" stroke="#134E4A" stroke-width="3" />
        <ellipse cx="50" cy="49" rx="22" ry="9" fill="url(#waterGrad)" stroke="#0D9488" stroke-width="2" />
        <!-- Eyes -->
        <circle cx="41" cy="30" r="5" fill="#FFFFFF" stroke="#134E4A" stroke-width="2" />
        <circle cx="41" cy="30" r="3" fill="#134E4A" />
        <circle cx="42" cy="28.5" r="1.3" fill="#FFFFFF" />
        <circle cx="59" cy="30" r="5" fill="#FFFFFF" stroke="#134E4A" stroke-width="2" />
        <circle cx="59" cy="30" r="3" fill="#134E4A" />
        <circle cx="60" cy="28.5" r="1.3" fill="#FFFFFF" />
        <!-- Mouth -->
        <path d="M46 36C47.5 39 52.5 39 54 36" stroke="#134E4A" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
      <!-- Label -->
      <rect x="13" y="132" width="84" height="22" rx="11" fill="#2FB8AC" />
      <text x="55" y="147" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">SIR FLUSH</text>
    </g>

    <!-- 3. Lil' Drip (Right in trio) -->
    <g transform="translate(240, 30)">
      <!-- Circle backdrop -->
      <circle cx="50" cy="55" r="48" fill="#2E2823" stroke="#F5B700" stroke-width="2" />
      <!-- Lil Drip SVG -->
      <g transform="translate(10, 15) scale(0.8)">
        <ellipse cx="50" cy="90" rx="28" ry="5" fill="#000000" opacity="0.3" />
        <path d="M50 8C50 8 18 46 18 66C18 83 32.5 94 50 94C67.5 94 82 83 82 66C82 46 50 8 50 8Z" fill="url(#dripBodyGrad)" stroke="#0B4B75" stroke-width="3.5" />
        <!-- Eyes -->
        <circle cx="38" cy="62" r="7.5" fill="#FFFFFF" stroke="#0B4B75" stroke-width="2.5" />
        <circle cx="39" cy="62" r="5" fill="#0A324E" />
        <circle cx="41" cy="60" r="2.2" fill="#FFFFFF" />
        <circle cx="62" cy="62" r="7.5" fill="#FFFFFF" stroke="#0B4B75" stroke-width="2.5" />
        <circle cx="61" cy="62" r="5" fill="#0A324E" />
        <circle cx="63" cy="60" r="2.2" fill="#FFFFFF" />
        <!-- Cheeks -->
        <ellipse cx="27" cy="71" rx="5" ry="3.5" fill="#FF6B6B" opacity="0.8" />
        <ellipse cx="73" cy="71" rx="5" ry="3.5" fill="#FF6B6B" opacity="0.8" />
        <!-- Cat mouth -->
        <path d="M43 71C46 73.5 48.5 73.5 50 71C51.5 73.5 54 73.5 57 71" stroke="#0B4B75" stroke-width="2.8" stroke-linecap="round" fill="none" />
      </g>
      <!-- Label -->
      <rect x="8" y="110" width="84" height="22" rx="11" fill="#F5B700" />
      <text x="50" y="125" fill="#1E1A17" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">LIL' DRIP</text>
    </g>
  </g>
</svg>

